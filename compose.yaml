# Port-published deployment: PORT is exposed on the host.
# This is the file docker compose loads when COMPOSE_FILE is unset.
services:
  tex:
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/tex.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    # What the server's deploy script probes before it keeps a new container.
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--spider',
          '-q',
          'http://127.0.0.1:${PORT:-10422}/v1/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - path: .env
        required: false
    ports:
      - '${PORT:-10422}:${PORT:-10422}'
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
